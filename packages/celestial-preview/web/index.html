<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#080e21"/><title>ORA Space — A GLASS Agent World</title><meta name="description" content="Ideas take form. GLASS and ORA."/><link rel="stylesheet" href="./style.css"/></head><body>
<main class="universe" id="universe" aria-label="The ORA Space celestial world">
 <div class="sky-photo"></div><div class="nebula"></div><div class="shore-photo"></div><div class="city-left"></div><div class="city-right"></div><div class="mobile-world"></div><div class="colorgrade"></div>
 <canvas id="optics" class="optics" aria-hidden="true"></canvas><canvas id="sky" class="sky-canvas" aria-hidden="true"></canvas>
 <div class="masthead"><button id="home" class="identity" type="button" aria-label="GLASS and ORA — return to the celestial world"><i class="emblem" aria-hidden="true"></i><span class="wordmark"><b>G L A S S</b><small>FOUNDED BY ABED KADAAN</small><em>ORA</em><small>A GLASS AGENT WORLD</small></span></button><span class="clockmark" aria-hidden="true">۞</span></div>
 <div class="headline"><h1>Ideas<br/><em>take form.</em></h1><p>GLASS and ORA turn imagination into living worlds — from real work to immersive experiences.</p></div>
 <div id="orb-zone" class="orb-zone" role="group" aria-label="Explore the living ORA constellations"><button id="orb-heart" type="button" aria-label="Awaken ORA and open the glass field"><span class="heart-core" aria-hidden="true"></span></button><span class="orbit-hint" id="orbit-hint">E X P L O R E &nbsp; T H E &nbsp; S K Y</span></div>
 <button id="landing" class="landing" type="button" aria-label="Awaken your ORA world"><span class="landing-glow"></span><span class="landing-name">G L A S S<br/><small>ORA</small></span></button>
 <div class="lensing" id="lensing" hidden><label for="glass-field" class="sr-only">Speak or type to your ORA</label><textarea id="glass-field" spellcheck="true" rows="2" placeholder="Begin an idea…" autocomplete="off"></textarea><span class="lens-guide" id="lens-guide">GLASS IS LISTENING · ENTER TO REALIZE · ESC TO RETURN</span></div>
 <div id="witness" class="witness" aria-live="polite" role="status"></div>
 <div id="constellation-label" class="constellation-label" aria-hidden="true"></div>
 <div id="readback" class="readback" hidden tabindex="-1" aria-live="polite"><span id="readback-text"></span></div>
 <div class="quiet-note">SPACE OS &nbsp; · &nbsp; CLOCK STRAIGHT &nbsp; · &nbsp; ORA 360</div>
</main>
<script type="module" src="./app.js"></script>
</body></html>
