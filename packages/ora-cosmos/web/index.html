</style></head><body><main id="world" aria-label="Computational ORA Space, sky only"><canvas id="sky" aria-hidden="true"></canvas><div class="top"><div class="name">O R A<small>A COMPUTATIONAL CONSTELLATION</small></div><div class="small">SPACE OS<br>CLOCK STRAIGHT</div></div><div id="guide" class="guide">TOUCH AN ORA TO COMPUTE</div><section class="box" id="panel" hidden><button type="button" id="close" class="close" aria-label="Close">x</button><div class="tag" id="kind"></div><h2 id="title">ORA</h2><p id="goal"></p><div class="tag" id="state"></div><button id="compute" type="button">Compute preview</button><pre id="trace" aria-live="polite"></pre></section><footer class="foot"><span id="tick">t: 000000</span><span>GAIA-FITTED MODEL</span><button id="witness" type="button">WITNESS</button></footer></main>
<script>
"use strict";
// Source: akadaan310/isnaad / src/lib/cosmos/stellar.ts & data/sky/astrophysics.json.
// Derived Gaia DR3 FIT parameters; stars below are GENERATED MODEL SAMPLES, NOT Gaia source rows.
const LAW={source:"ISNAAD Gaia DR3 TAP fit",samples:{colorMagnitude:399993,teff:200000,disc:300000},hZPc:121,fitR2:0.977,epoch:2016,truth:"GENERATED_GAIA_FITTED_MODEL"};
const GAIA_DR3_COUNT=1811709771;
const ORAS=[
{id:"ora-sovereign",name:"ORA",role:"SOVEREIGN",op:"govern.constellation",goal:"Govern ORA identity, typed capability grants and continuity",state:"LOCAL_KERNEL"},
{id:"ora-language",name:"Language",role:"ORACLE",op:"language.inspect",goal:"Inspect script forms and grammar under source constraints",state:"LOCAL_PREVIEW"},
{id:"ora-scene",name:"Scene",role:"GENERATOR",op:"scene.generate",goal:"Compose deterministic Space OS scene recipes",state:"LOCAL_PREVIEW"},
{id:"ora-clock",name:"Chronos",role:"CLOCK",op:"clock.sample",goal:"Witness the shared 24 Hz logical timeline",state:"LOCAL_PREVIEW"},
{id:"ora-unison",name:"Unison",role:"COMPILER",op:"grammar.propose",goal:"Propose typed grammars without silently admitting them",state:"LOCAL_PREVIEW"},
{id:"ora-baton",name:"Baton",role:"CONTINUITY",op:"baton.offer",goal:"Negotiate an authenticated handoff and store receipts",state:"UNIMPLEMENTED"},
{id:"ora-witness",name:"Witness",role:"VERIFIER",op:"render.profile",goal:"Measure browser rendering speed without images or screenshots",state:"LOCAL_KERNEL"},
{id:"ora-space",name:"ISNAAD",role:"ASTROPHYSICS",op:"gaia.model",goal:"Explore a measured Gaia-derived galactic population model",state:"LOCAL_PREVIEW"}];
const EDGES=[["ora-sovereign","ora-language"],["ora-sovereign","ora-scene"],["ora-sovereign","ora-clock"],["ora-sovereign","ora-unison"],["ora-sovereign","ora-baton"],["ora-sovereign","ora-witness"],["ora-sovereign","ora-space"],["ora-scene","ora-space"],["ora-unison","ora-language"],["ora-witness","ora-scene"]];
const C=document.getElementById("sky"),ctx=C.getContext("2d",{alpha:false}),T=Math.PI*2;
const $=x=>document.getElementById(x),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const seedRand=(()=>{let x=41729;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}})();
const hist=[[-.4,228],[0,2259],[.4,3796],[.8,19360],[1.2,12868],[1.6,10478],[2,16874],[2.4,35616],[2.8,53708],[3.2,36688],[3.6,8229],[4,1324]];
function colorPick(){let s=hist.reduce((a,z)=>a+z[1],0),t=seedRand()*s;for(const [c,n]of hist){t-=n;if(t<=0)return c}return 1}
const stars=Array.from({length:900},(_,i)=>{let c=colorPick(),a=seedRand()*T,r=Math.sqrt(seedRand())*.72,z=-Math.log(Math.max(1e-8,1-seedRand()))*LAW.hZPc*(seedRand()<.5?-1:1);return{x:.5+Math.cos(a)*r*.9,y:.47+Math.sin(a)*r*.19+z/1700,mag:seedRand(),color:c,phase:seedRand()*T,truth:"GENERATED_NOT_OBSERVED"}});
const record={frameTimes:[],cpuMs:[],errors:0,events:[],last:null,frames:0,dpr:1,started:new Date().toISOString()};
let W=0,H=0,selected=null,shift=0,down=null;
function resize(){W=innerWidth;H=innerHeight;record.dpr=Math.min(devicePixelRatio||1,W<700?1.3:1.6);C.width=Math.round(W*record.dpr);C.height=Math.round(H*record.dpr);ctx.setTransform(record.dpr,0,0,record.dpr,0,0);record.events.push({kind:"resize",w:W,h:H})}resize();addEventListener("resize",resize);
const start=performance.now();
function pos(i,t){if(i===0)return{x:W*.5,y:H*.47};const a=-Math.PI/2+(i-1)*T/(ORAS.length-1)+shift+(reduce?0:.01*Math.sin(t*.17+i));let r=Math.min(W*.41,H*.3);return{x:W*.5+Math.cos(a)*r,y:H*.47+Math.sin(a)*r*.84}}
function orb(x,y,r,core,t){ctx.save();ctx.globalCompositeOperation="screen";const g=ctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);g.addColorStop(0,core?"#fbe5bd":"#ced2ff");g.addColorStop(.12,core?"#df9b6a":"#7a83c6");g.addColorStop(.5,"#1e1c4188");g.addColorStop(.87,"#0a0a1f");g.addColorStop(1,core?"#ddb584":"#afb4e4");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,T);ctx.fill();ctx.strokeStyle=core?"#e7c69890":"#acafd899";ctx.beginPath();ctx.arc(x,y,r,0,T);ctx.stroke();ctx.strokeStyle=core?"#ce9b7399":"#9495d560";ctx.beginPath();ctx.ellipse(x,y,r*1.3,r*.29,-.23,0,T);ctx.stroke();if(core){const b=ctx.createRadialGradient(x,y,0,x,y,r*.49);b.addColorStop(0,"#fff5d8");b.addColorStop(.2,"#f4bd78");b.addColorStop(1,"#eb8b2a00");ctx.fillStyle=b;ctx.beginPath();ctx.arc(x,y,r*.5,0,T);ctx.fill()}ctx.restore()}
function draw(t){const b=ctx.createRadialGradient(W*.49,H*.43,0,W*.5,H*.5,Math.max(W,H)*.8);b.addColorStop(0,"#171229");b.addColorStop(.3,"#090b1d");b.addColorStop(.78,"#02040d");b.addColorStop(1,"#010107");ctx.fillStyle=b;ctx.fillRect(0,0,W,H);
ctx.save();for(const s of stars){const a=reduce?1:.7+.3*Math.sin(s.phase+t*(.09+.13*s.mag)),x=s.x*W,y=s.y*H;if(x<0||x>W||y<0||y>H)continue;ctx.fillStyle=`rgba(${s.color>2?255:202},${s.color>2?195:225},${s.color<1?245:209},${(.18+.44*a).toFixed(3)})`;ctx.beginPath();ctx.arc(x,y,.25+1.25*(1-s.mag),0,T);ctx.fill()}ctx.restore();
const nodes=ORAS.map((o,i)=>pos(i,t)),center=nodes[0];
ctx.save();ctx.globalCompositeOperation="screen";for(const [from,to]of EDGES){const i=ORAS.findIndex(x=>x.id===from),j=ORAS.findIndex(x=>x.id===to),a=nodes[i],b=nodes[j];if(!a||!b)continue;ctx.strokeStyle=(selected===from||selected===to)?"#efd1a688":"#d5bcb72e";ctx.lineWidth=selected===from||selected===to?1.35:.8;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo((a.x+b.x)/2-(b.y-a.y)*.08,(a.y+b.y)/2+(b.x-a.x)*.08,b.x,b.y);ctx.stroke()}ctx.restore();
for(let i=1;i<nodes.length;i++){const p=nodes[i],r=Math.min(22,Math.min(W,H)*.047);orb(p.x,p.y,r,false,t);ctx.fillStyle=selected===ORAS[i].id?"#f5dab1":"#b7b0d0";ctx.textAlign="center";ctx.font="10px monospace";ctx.fillText(ORAS[i].name.toUpperCase(),p.x,p.y+r+19)}
const r=Math.min(88,Math.min(W,H)*.16);orb(center.x,center.y,r,true,t);ctx.textAlign="center";ctx.font=`${W<650?26:38}px Georgia,serif`;ctx.fillStyle="#f4dfc4";ctx.fillText("O R A",center.x,center.y+r*.76)}
function hit(x,y,t){let best=null;ORAS.forEach((o,i)=>{let p=pos(i,t),d=Math.hypot(x-p.x,y-p.y),r=i===0?90:38;if(d<r&&(!best||d<best.d))best={o,d}});return best&&best.o}
function show(o){selected=o.id;$("panel").hidden=false;$("title").textContent=o.name;$("kind").textContent=o.role+" · "+o.op;$("goal").textContent=o.goal;$("state").textContent=o.id+" / "+o.state;$("trace").textContent="";record.events.push({kind:"select",id:o.id});$("guide").textContent="ORA MACHINE · "+o.role}
$("close").onclick=()=>{$("panel").hidden=true;selected=null};$("witness").onclick=()=>show(ORAS[6]);
$("compute").onclick=()=>{const o=ORAS.find(o=>o.id===selected);if(!o)return;const t=Math.max(0,Math.floor((performance.now()-start)*.024));$("trace").textContent=JSON.stringify({ora:o.id,operator:o.op,clock_tick:t,effect:"NONE",status:o.state==="UNIMPLEMENTED"?"ADAPTER_REQUIRED":"PREVIEW_ONLY",source:o.id==="ora-space"?LAW.source:"LOCAL_CONTRACT"},null,2)};
C.addEventListener("pointerdown",e=>down={x:e.clientX,y:e.clientY,shift});
C.addEventListener("pointermove",e=>{if(down&&Math.abs(e.clientX-down.x)>10)shift=down.shift+(e.clientX-down.x)/Math.max(W,200)*.7});
C.addEventListener("pointerup",e=>{const d=down;down=null;if(d&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>15)return;const o=hit(e.clientX,e.clientY,Math.max(0,(performance.now()-start)/1000));if(o)show(o);else{$("panel").hidden=true;selected=null}});

function frame(now){if(document.visibilityState==="hidden"){record.last=now;requestAnimationFrame(frame);return}const startDraw=performance.now();const seconds=Math.max(0,(now-start)/1000);try{draw(reduce?0:seconds)}catch(e){record.errors++;record.events.push({kind:"error",message:String(e)});return}const cost=performance.now()-startDraw;if(record.last!==null){record.frameTimes.push(now-record.last);record.cpuMs.push(cost);if(record.frameTimes.length>1800){record.frameTimes.shift();record.cpuMs.shift()}}record.last=now;record.frames++;if(record.frames%24===0)$("tick").textContent="t: "+String(Math.floor(seconds*24)).padStart(7,"0");requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.ORA_SPACE={version:"cosmos/0.6",oraCount:ORAS.length,graphEdges:EDGES,gaiaCatalogCount:GAIA_DR3_COUNT,gaiaFit:LAW,diagnostics:report,inspect:id=>{const o=ORAS.find(o=>o.id===id);if(o)show(o);return o},compute:id=>{const o=ORAS.find(o=>o.id===id);return o?{ora:o.id,status:o.state,effect:"NONE"}:null}};
addEventListener("error",()=>record.errors++);
</script></main></body></html>
